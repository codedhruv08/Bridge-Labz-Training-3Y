<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced CSS Selectors</title>
    <link rel="stylesheet" href="Q5_selectors.css">
</head>
<body>
    <main>
        <h1>Advanced CSS Selectors</h1>

        <section class="items">
            <h2>Item List</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>Java</li>
            </ul>
        </section>

        <section class="forms">
            <h2>Attribute Selectors</h2>
            <input type="text" placeholder="Text input">
            <input type="email" placeholder="Email input">
            <a href="https://example.com">Secure HTTPS Link</a>
            <a href="http://example.com">HTTP Link</a>
        </section>

        <section class="combinators">
            <h2>Combinators</h2>
            <div class="parent">
                <p>Direct child paragraph</p>
                <span><p>Descendant paragraph</p></span>
                <p>Another paragraph</p>
                <p>Sibling paragraph</p>
            </div>
        </section>
    </main>
</body>
</html>
