<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
</head>
<body>

    <h1>Contact Us</h1>

    <form action="#" method="post">

        <label>Full Name:</label>
        <input
            type="text"
            name="fullname"
            placeholder="Enter your full name"
            required>
        <br><br>

        <label>Email:</label>
        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required>
        <br><br>

        <label>Subject:</label>
        <input
            type="text"
            name="subject"
            placeholder="Enter subject"
            required>
        <br><br>

        <label>Message:</label>
        <br>
        <textarea
            name="message"
            placeholder="Write your message here"
            rows="5"
            cols="40"
            required></textarea>

        <br><br>

        <input type="submit" value="Send Message">

    </form>

</body>
</html>
