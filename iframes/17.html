<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Page</title>
</head>
<body>

    <h1>Simple Form</h1>

    <form action="result.html" method="get" target="resultFrame">

        <label>Enter Your Name:</label>
        <input type="text" name="name" required>

        <input type="submit" value="Submit">

    </form>

    <br>

    <!-- Result page will be loaded here after submission -->
    <iframe
        name="resultFrame"
        width="60%"
        height="150"
        title="Result">
    </iframe>

</body>
</html>
