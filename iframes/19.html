<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security</title>
</head>
<body>

    <h1>Secure Form</h1>

    <form action="#" method="post" autocomplete="off">

        <label>Username:</label>
        <input type="text" name="username" required>
        <br><br>

        <label>Email:</label>
        <input type="email" name="email" required>
        <br><br>

        <label>Password:</label>
        <input type="password" name="password" required>
        <br><br>

        <input type="submit" value="Submit">

    </form>

    <p>
        Turning off autocomplete can improve security by preventing
        browsers from automatically storing and filling sensitive
        information on shared or public computers.
    </p>

</body>
</html>
