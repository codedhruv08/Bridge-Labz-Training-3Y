<!DOCTYPE html>
<html lang="en">

<head>

    <!-- The title defines the name shown in the browser tab -->
    <title>Important Head Elements</title>

    <!-- Charset defines the character encoding -->
    <meta charset="UTF-8">

    <!-- Description provides information about the webpage -->
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements">

    <!-- Author specifies the creator of the webpage -->
    <meta
        name="author"
        content="Dhruv">

    <!-- Base sets the base URL for relative links -->
    <base href="https://example.com/">

    <!-- Link connects external resources such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- Style is used for CSS. It is empty because this assignment uses no CSS. -->
    <style>
    </style>

    <!-- Script is used for JavaScript. It is empty because this assignment uses no JavaScript. -->
    <script>
    </script>

</head>

<body>

    <h1>Important Head Elements</h1>

    <p>
        This page demonstrates important elements used inside the HTML head.
    </p>

</body>

</html>
