<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Cards</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    #products { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
    .card { border: 1px solid #ccc; border-radius: 6px; padding: 10px; text-align: center; }
    .card img { height: 140px; max-width: 100%; object-fit: contain; }
    .card h3 { font-size: 14px; }
  </style>
</head>
<body>
  <h2>Products</h2>
  <div id="products">Loading...</div>
  <script src="q6_productFetcher.js"></script>
</body>
</html>
