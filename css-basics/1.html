<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            color: #222;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 15px 5%;
            background-color: #16324f;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 1em;
            font-size: 1rem;
        }

        main {
            flex: 1;
            padding: 120px 10% 40px;
        }

        .portfolio {
            min-height: 60vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2rem;
        }

        .portfolio img {
            width: 250px;
            height: 250px;
            border-radius: 50%;
        }

        .portfolio p {
            font-size: 1.2em;
            line-height: 1.6;
        }

        footer {
            margin-top: auto;
            text-align: center;
            padding: 20px;
            background-color: #16324f;
            color: white;
        }

        @media (max-width: 600px) {
            .portfolio {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Dhruv Gautam</h1>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main id="home">
        <section class="portfolio" id="about">
            <img src="https://via.placeholder.com/250" alt="Profile Image">

            <div>
                <h2>Hello, I am Dhruv</h2>
                <br>
                <p>
                    I am a Computer Science student interested in web development,
                    programming, and software development. I enjoy learning new
                    technologies and building useful projects.
                </p>
            </div>
        </section>
    </main>

    <footer id="contact">
        <p>© 2026 Dhruv Gautam | All Rights Reserved</p>
    </footer>

</body>
</html>
