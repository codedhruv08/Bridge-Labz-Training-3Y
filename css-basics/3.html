<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Members</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
        }

        .team {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .card {
            flex: 1;
            padding: 25px;
            margin: 10px;
            border: 2px solid #ddd;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .lead {
            background-color: #fff3cd;
            border: 3px dashed #ff9800;
        }

        @media (max-width: 600px) {
            .team {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1>Our Team Members</h1>

    <div class="team">

        <article class="card">
            <h2>Rahul Sharma</h2>
            <h3>Web Developer</h3>
            <p>
                Rahul works on creating responsive and user-friendly websites.
            </p>
        </article>

        <article class="card lead">
            <h2>Dhruv Gautam</h2>
            <h3>Team Lead</h3>
            <p>
                Dhruv manages the team and helps in planning and development.
            </p>
        </article>

        <article class="card">
            <h2>Priya Singh</h2>
            <h3>UI Designer</h3>
            <p>
                Priya creates attractive and simple designs for web projects.
            </p>
        </article>

    </div>

</body>
</html>
