<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
        }

        .pricing {
            display: flex;
            gap: 20px;
            padding: 30px;
            align-items: stretch;
        }

        .plan {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            background-color: white;
            border: 2px solid #ccc;
            transition: 0.3s;
        }

        .plan:hover {
            transform: scale(1.05);
            background-color: #e3f2fd;
        }

        .plan ul {
            text-align: left;
            flex-grow: 1;
        }

        .plan li {
            margin: 15px 0;
        }

        .plan a {
            background-color: #1976d2;
            color: white;
            padding: 12px;
            text-decoration: none;
            border-radius: 5px;
        }

        .popular {
            border: 4px solid #ff9800;
            background-color: #fff8e1;
        }

        @media (max-width: 600px) {
            .pricing {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <h1>Our Pricing Plans</h1>

    <div class="pricing">

        <section class="plan">
            <h2>Basic</h2>
            <h3>₹199/month</h3>

            <ul>
                <li>5 Projects</li>
                <li>Basic Support</li>
                <li>10 GB Storage</li>
            </ul>

            <a href="#">Choose Plan</a>
        </section>

        <section class="plan popular">
            <h2>Standard</h2>
            <h3>₹499/month</h3>

            <ul>
                <li>20 Projects</li>
                <li>Priority Support</li>
                <li>50 GB Storage</li>
            </ul>

            <a href="#">Choose Plan</a>
        </section>

        <section class="plan">
            <h2>Premium</h2>
            <h3>₹999/month</h3>

            <ul>
                <li>Unlimited Projects</li>
                <li>24/7 Support</li>
                <li>200 GB Storage</li>
            </ul>

            <a href="#">Choose Plan</a>
        </section>

    </div>

</body>
</html>
