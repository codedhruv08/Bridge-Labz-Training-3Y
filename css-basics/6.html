<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .photo {
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .photo img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: 0.3s;
        }

        .photo span {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px 0;
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            opacity: 0;
            transition: 0.3s;
        }

        .photo:hover img {
            transform: scale(1.1);
        }

        .photo:hover span {
            opacity: 1;
        }

        @media (max-width: 700px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 450px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>My Photo Gallery</h1>

    <main class="gallery">

        <div class="photo">
            <img src="https://picsum.photos/400/300?random=1" alt="Nature">
            <span>Beautiful Nature</span>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?random=2" alt="Mountain">
            <span>Mountain View</span>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?random=3" alt="Beach">
            <span>Beautiful Beach</span>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?random=4" alt="Forest">
            <span>Green Forest</span>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?random=5" alt="City">
            <span>City View</span>
        </div>

        <div class="photo">
            <img src="https://picsum.photos/400/300?random=6" alt="Sunset">
            <span>Beautiful Sunset</span>
        </div>

    </main>

</body>
</html>
