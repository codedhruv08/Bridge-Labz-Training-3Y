<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 380px; margin: 40px auto; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 10px 20px; }
    .error { color: red; font-size: 13px; margin: 4px 0 0; padding-left: 18px; }
    #success { color: green; font-weight: bold; margin-top: 15px; }
  </style>
</head>
<body>
  <h2>Login</h2>
  <form id="loginForm" novalidate>
    <label for="username">Username</label>
    <input type="text" id="username"><ul class="error" id="usernameErrors"></ul>
    <label for="password">Password</label>
    <input type="password" id="password"><ul class="error" id="passwordErrors"></ul>
    <button type="submit">Login</button>
  </form>
  <div id="success"></div>
  <script src="q7_loginValidation.js"></script>
</body>
</html>
