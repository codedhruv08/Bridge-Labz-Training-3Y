<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Registration</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 380px; margin: 40px auto; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input { width: 100%; padding: 8px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    input.valid { border-color: green; }
    input.invalid { border-color: red; }
    .error { color: red; font-size: 13px; min-height: 16px; }
    button { margin-top: 18px; padding: 10px 20px; }
    #result { margin-top: 15px; color: green; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Student Registration</h2>
  <form id="studentForm" novalidate>
    <label for="name">Name</label>
    <input type="text" id="name"><div class="error" id="nameError"></div>

    <label for="email">Email</label>
    <input type="text" id="email"><div class="error" id="emailError"></div>

    <label for="phone">Phone</label>
    <input type="text" id="phone"><div class="error" id="phoneError"></div>

    <label for="password">Password</label>
    <input type="password" id="password"><div class="error" id="passwordError"></div>

    <button type="submit">Register</button>
  </form>
  <div id="result"></div>
  <script src="q2_studentForm.js"></script>
</body>
</html>
