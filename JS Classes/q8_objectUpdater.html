<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dynamic Object Updater</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 380px; margin: 40px auto; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 18px; padding: 10px 20px; }
    #display { margin-top: 20px; background: #f2f2f2; padding: 12px; }
  </style>
</head>
<body>
  <h2>Edit User</h2>
  <form id="userForm">
    <label for="name">Name</label><input type="text" id="name">
    <label for="email">Email</label><input type="email" id="email">
    <label for="age">Age</label><input type="number" id="age">
    <button type="submit">Update</button>
  </form>
  <div id="display"></div>
  <script src="q8_objectUpdater.js"></script>
</body>
</html>
