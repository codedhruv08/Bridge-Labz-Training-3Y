<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Movie Ticket Booking</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 380px; margin: 40px auto; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input { width: 100%; padding: 8px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    input.valid { border-color: green; }
    input.invalid { border-color: red; }
    .error { color: red; font-size: 13px; min-height: 16px; }
    button { margin-top: 18px; padding: 10px 20px; }
    #ticket { margin-top: 20px; padding: 12px; border: 2px dashed #333; display: none; }
  </style>
</head>
<body>
  <h2>Book Movie Tickets</h2>
  <form id="bookingForm" novalidate>
    <label for="name">Name</label>
    <input type="text" id="name"><div class="error" id="nameError"></div>
    <label for="email">Email</label>
    <input type="text" id="email"><div class="error" id="emailError"></div>
    <label for="seats">Seats (1-10)</label>
    <input type="text" id="seats"><div class="error" id="seatsError"></div>
    <button type="submit">Book Now</button>
  </form>
  <div id="ticket"></div>
  <script src="q5_movieBooking.js"></script>
</body>
</html>
