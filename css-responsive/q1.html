<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q1 - Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="q1.css">
</head>
<body>
  <header>
    <h1>Responsive Image Filter Gallery</h1>
  </header>

  <main>
    <!-- Grid gallery with 6 images, each showing a different CSS filter -->
    <section class="gallery">

      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1015/400/300" alt="Mountain river" class="filter-blur">
        <figcaption>Blur</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1016/400/300" alt="Mountain range" class="filter-grayscale">
        <figcaption>Grayscale</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1018/400/300" alt="Forest lake" class="filter-sepia">
        <figcaption>Sepia</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1019/400/300" alt="Rocky coast" class="filter-brightness">
        <figcaption>Brightness</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1021/400/300" alt="Green hills" class="filter-contrast">
        <figcaption>Contrast</figcaption>
      </figure>

      <figure class="gallery-item">
        <img src="https://picsum.photos/id/1024/400/300" alt="Dog on beach" class="filter-hue">
        <figcaption>Hue Rotate</figcaption>
      </figure>

    </section>
  </main>

  <footer>
    <p>&copy; 2026 Image Filter Gallery</p>
  </footer>
</body>
</html>
