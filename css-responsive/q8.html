<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q8 - Filter Comparison Layout</title>
  <link rel="stylesheet" href="q8.css">
</head>
<body>
  <header>
    <h1>Before &amp; After Comparison</h1>
  </header>

  <main>
    <section class="compare-row">
      <figure class="compare-item">
        <img src="https://picsum.photos/id/1041/400/300" alt="Original landscape photo">
        <figcaption>Before</figcaption>
      </figure>

      <figure class="compare-item">
        <img src="https://picsum.photos/id/1041/400/300" alt="Landscape photo with adjusted brightness and contrast" class="edited">
        <figcaption>After</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
