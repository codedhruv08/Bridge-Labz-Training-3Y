<!DOCTYPE html>
<html>
<head>
    <title>Loading Animation</title>
</head>
<body>

<div class="loader">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<style>
body {
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.loader {
    display:flex;
    gap:10px;
}

.circle {
    width:20px;
    height:20px;
    border-radius:50%;
    background:#333;
    animation:move 0.8s infinite;
}

.circle:nth-child(2) {
    animation-delay:0.2s;
}

.circle:nth-child(3) {
    animation-delay:0.4s;
}

@keyframes move {
    0%,100% {
        transform:translateY(0);
    }

    50% {
        transform:translateY(-20px);
    }
}
</style>

</body>
</html>
