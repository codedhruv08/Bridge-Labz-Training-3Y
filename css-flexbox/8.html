<!DOCTYPE html>
<html>
<head>
    <title>Photo Gallery</title>
</head>
<body style="margin:0; font-family:Arial;">

<h1 style="text-align:center;">Photo Gallery</h1>

<div class="gallery">

    <figure>
        <img src="https://picsum.photos/400/300?1">
        <figcaption>Nature</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/400/300?2">
        <figcaption>Mountain</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/400/300?3">
        <figcaption>Forest</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/400/300?4">
        <figcaption>City</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/400/300?5">
        <figcaption>Beach</figcaption>
    </figure>

    <figure>
        <img src="https://picsum.photos/400/300?6">
        <figcaption>Sunset</figcaption>
    </figure>

</div>

<style>
.gallery {
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
    gap:20px;
    padding:30px;
}

figure {
    margin:0;
    overflow:hidden;
    text-align:center;
}

img {
    width:100%;
    height:250px;
    object-fit:cover;
    transition:transform 0.5s ease;
}

img:hover {
    transform:scale(1.08);
}

figcaption {
    padding:10px;
    background:#eee;
}
</style>

</body>
</html>
