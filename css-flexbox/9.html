<!DOCTYPE html>
<html>
<head>
    <title>Card Flip</title>
</head>
<body>

<div class="container">

    <div class="card">

        <div class="front">
            <img src="https://picsum.photos/300/200">
            <h2>Web Development</h2>
        </div>

        <div class="back">
            <h2>About</h2>
            <p>
                Web development is the process of creating
                websites using HTML, CSS and JavaScript.
            </p>
        </div>

    </div>

</div>

<style>
body {
    margin:0;
}

.container {
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    perspective:1000px;
}

.card {
    width:300px;
    height:350px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.8s;
}

.card:hover {
    transform:rotateY(180deg);
}

.front,
.back {
    position:absolute;
    width:100%;
    height:100%;
    backface-visibility:hidden;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:10px;
    box-sizing:border-box;
}

.front {
    background:#eee;
}

.front img {
    width:250px;
    height:180px;
    object-fit:cover;
}

.back {
    background:#ddd;
    transform:rotateY(180deg);
}
</style>

</body>
</html>
