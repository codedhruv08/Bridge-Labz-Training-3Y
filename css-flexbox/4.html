<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
</head>
<body style="margin:0; font-family:Arial;">

<div class="dashboard">

<header>
    <h2>My Dashboard</h2>
</header>

<aside>
    <h3>Menu</h3>
    <p>Dashboard</p>
    <p>Profile</p>
    <p>Settings</p>
    <p>Logout</p>
</aside>

<main>
    <div class="box box1">Total Users</div>
    <div class="box">Projects</div>
    <div class="box">Messages</div>
    <div class="box">Statistics</div>
</main>

</div>

<style>
.dashboard {
    display:grid;
    grid-template-columns:200px 1fr;
    grid-template-rows:80px 1fr;
    min-height:100vh;
}

header {
    grid-column:1 / 3;
    background:#222;
    color:white;
    padding:10px 25px;
}

aside {
    background:#eee;
    padding:20px;
}

main {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    padding:30px;
}

.box {
    background:#ddd;
    padding:40px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:0.3s;
}

.box1 {
    grid-column:span 2;
}

.box:hover {
    transform:scale(1.05);
    box-shadow:0 5px 15px gray;
}

@media(max-width:700px) {
    .dashboard {
        grid-template-columns:1fr;
        grid-template-rows:auto auto auto;
    }

    header {
        grid-column:1;
    }

    main {
        grid-template-columns:1fr;
    }

    .box1 {
        grid-column:span 1;
    }
}
</style>

</body>
</html>
