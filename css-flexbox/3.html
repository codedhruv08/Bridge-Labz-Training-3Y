<!DOCTYPE html>
<html>
<head>
    <title>Homepage</title>
</head>
<body style="margin:0; font-family:Arial;">

<div style="min-height:100vh; display:flex; flex-direction:column;">

<header style="background:#222; color:white; padding:20px;">
    <nav style="display:flex; justify-content:space-around;">
        <a href="#" style="color:white;">Home</a>
        <a href="#" style="color:white;">About</a>
        <a href="#" style="color:white;">Services</a>
        <a href="#" style="color:white;">Contact</a>
    </nav>
</header>

<main style="flex:1; display:flex; align-items:center; justify-content:center; gap:30px; padding:30px;">

    <div class="box">
        <h2>Services</h2>
        <p>We provide quality services.</p>
    </div>

    <div class="box">
        <h2>Projects</h2>
        <p>We create useful projects.</p>
    </div>

    <div class="box">
        <h2>Contact</h2>
        <p>Contact us for more information.</p>
    </div>

</main>

<footer style="background:#222; color:white; text-align:center; padding:20px;">
    © 2026 My Website
</footer>

</div>

<style>
.box {
    flex:1;
    padding:40px;
    text-align:center;
    background:#eee;
    transition:0.3s;
}

.box:hover {
    transform:rotate(2deg);
}

@media(max-width:700px) {
    main {
        flex-direction:column;
    }

    .box {
        width:80%;
    }
}
</style>

</body>
</html>
