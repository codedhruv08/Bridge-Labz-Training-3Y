<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEase - Product Catalog</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q3.css">
</head>
<body>

<header class="bg-dark text-white text-center py-3">
  <h1 class="mb-0">ShopEase Store</h1>
</header>

<main class="container my-5">
  <h2 class="text-center mb-4">Our Products</h2>

  <!-- col-12 = 1 column on mobile, col-sm-6 = 2 columns on tablets,
       col-md-3 = 4 columns on desktop -->
  <div class="row g-4">

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card product-card h-100 shadow-sm">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Wireless Headphones">
        <div class="card-body text-center">
          <h5 class="card-title">Wireless Headphones</h5>
          <p class="card-text fw-bold">$59.99</p>
          <button class="btn btn-primary btn-sm">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card product-card h-100 shadow-sm">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Smart Watch">
        <div class="card-body text-center">
          <h5 class="card-title">Smart Watch</h5>
          <p class="card-text fw-bold">$89.99</p>
          <button class="btn btn-primary btn-sm">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card product-card h-100 shadow-sm">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Running Shoes">
        <div class="card-body text-center">
          <h5 class="card-title">Running Shoes</h5>
          <p class="card-text fw-bold">$74.99</p>
          <button class="btn btn-primary btn-sm">Add to Cart</button>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-md-3">
      <div class="card product-card h-100 shadow-sm">
        <img src="https://placehold.co/300x200" class="card-img-top" alt="Backpack">
        <div class="card-body text-center">
          <h5 class="card-title">Travel Backpack</h5>
          <p class="card-text fw-bold">$45.99</p>
          <button class="btn btn-primary btn-sm">Add to Cart</button>
        </div>
      </div>
    </div>

  </div>
</main>

<footer class="bg-dark text-white text-center py-3">
  <p class="mb-0">&copy; 2026 ShopEase</p>
</footer>

</body>
</html>
