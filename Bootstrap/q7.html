<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q7.css">
</head>
<body>

<header class="bg-primary text-white text-center py-3">
  <div class="container d-flex justify-content-center align-items-center gap-2">
    <h1 class="mb-0">My Tasks</h1>
    <!-- Badge counter for pending tasks -->
    <span class="badge bg-warning text-dark fs-6">4 Pending</span>
  </div>
</header>

<main class="container my-5">
  <ul class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Finish Bootstrap assignment
      <span class="badge bg-danger">High</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Review React component
      <span class="badge bg-danger">High</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Update resume
      <span class="badge bg-warning text-dark">Medium</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center">
      Read a chapter of DSA book
      <span class="badge bg-success">Low</span>
    </li>
    <li class="list-group-item d-flex justify-content-between align-items-center text-decoration-line-through text-muted">
      Set up project repository
      <button class="btn btn-sm btn-success" disabled>
        Completed <span class="badge bg-light text-dark ms-1">&#10003;</span>
      </button>
    </li>
  </ul>
</main>

<footer class="bg-primary text-white text-center py-3">
  <p class="mb-0">&copy; 2026 Task Tracker</p>
</footer>

</body>
</html>
