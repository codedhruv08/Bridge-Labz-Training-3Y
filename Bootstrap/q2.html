<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhruv Sharma - Portfolio</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q2.css">
</head>
<body class="bg-light text-dark">

<header class="text-center p-5 bg-light">
  <div class="container">
    <!-- rounded-circle profile image -->
    <img src="https://placehold.co/150x150" alt="Profile photo" class="img-fluid rounded-circle mb-3 border">
    <h1 class="fw-bold mb-1">Dhruv Sharma</h1>
    <p class="text-center fw-bold text-secondary">Full-Stack Developer | CS Student</p>

    <!-- Two action buttons with margin utilities -->
    <div class="mt-4">
      <button class="btn btn-primary mt-4 me-2">Hire Me</button>
      <button class="btn btn-outline-dark mt-4">Download CV</button>
    </div>
  </div>
</header>

<main>
  <section class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-md-8 p-5 bg-white rounded shadow-sm mt-4 mb-3">
        <h3 class="text-center fw-bold mb-4">About Me</h3>
        <p class="text-center">
          I build web applications end to end, from database design to
          responsive front-ends, and I love turning ideas into working products.
        </p>
      </div>
    </div>
  </section>

  <!-- Small contact form -->
  <section class="container mb-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <h3 class="text-center fw-bold mb-3">Get In Touch</h3>
        <form>
          <div class="mb-3">
            <label class="form-label">Your Name</label>
            <input type="text" class="form-control" placeholder="Enter your name">
          </div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" placeholder="name@example.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea class="form-control" rows="3" placeholder="Say hello..."></textarea>
          </div>
          <div class="text-center">
            <button type="submit" class="btn btn-primary px-4">Send Message</button>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="bg-dark text-white text-center p-3">
  <p class="mb-0">&copy; 2026 Dhruv Sharma</p>
</footer>

</body>
</html>
