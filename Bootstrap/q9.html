<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog - Pagination</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="q9.css">
</head>
<body>

<header class="bg-dark text-white text-center py-3">
  <h1 class="mb-0">The Daily Post</h1>
</header>

<main class="container my-5">
  <div class="row g-4 mb-5">
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Understanding Bootstrap Grids</h5>
          <p class="card-text">A quick walkthrough of how the 12-column grid system works.</p>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card h-100">
        <div class="card-body">
          <h5 class="card-title">Why Responsive Design Matters</h5>
          <p class="card-text">Mobile traffic keeps growing — here's why your site needs to keep up.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination component -->
  <nav aria-label="Blog pagination">
    <ul class="pagination justify-content-center">
      <li class="page-item"><a class="page-link" href="#">Previous</a></li>
      <li class="page-item active"><a class="page-link" href="#">1</a></li>
      <li class="page-item"><a class="page-link" href="#">2</a></li>
      <li class="page-item"><a class="page-link" href="#">Next</a></li>
    </ul>
  </nav>

  <!-- Simple pager -->
  <div class="d-flex justify-content-between container mt-4">
    <button class="btn btn-outline-secondary">&laquo; Older Posts</button>
    <button class="btn btn-outline-secondary">Newer Posts &raquo;</button>
  </div>
</main>

<footer class="bg-dark text-white text-center py-3">
  <p class="mb-0">&copy; 2026 The Daily Post</p>
</footer>

</body>
</html>
