<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Q10 - Mini UI</title>
<style>
nav a{transition:.3s}nav a:hover{color:#facc15!important}input:focus{outline:none;border-color:#2563eb!important;box-shadow:0 0 5px #93c5fd}
button{transition:.3s}button:hover{transform:translateY(-2px);box-shadow:0 5px 10px #aaa}button:focus{outline:3px solid #facc15}
@media(max-width:700px){header{flex-direction:column!important;gap:15px}.card{flex-direction:column!important}.image{width:100%!important}}
</style></head>
<body style="margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#eef2f7;display:flex;flex-direction:column;box-sizing:border-box">
<header style="background:#1e3a5f;color:white;padding:20px 8%;display:flex;justify-content:space-between;align-items:center"><h1 style="margin:0">My Mini UI</h1><nav style="display:flex;gap:20px"><a href="#" style="color:white;text-decoration:none">Home</a><a href="#" style="color:white;text-decoration:none">About</a><a href="#" style="color:white;text-decoration:none">Contact</a></nav></header>
<main style="flex:1;display:flex;justify-content:center;align-items:center;padding:40px 20px">
<section class="card" style="width:800px;max-width:100%;background:white;border:1px solid #ddd;border-radius:15px;padding:35px;box-shadow:0 8px 25px #bbb;display:flex;gap:40px;align-items:center">
<div style="flex:1"><h2>Welcome Back!</h2><p>Fill in the form below to continue.</p>
<form style="display:flex;flex-direction:column;gap:10px"><label for="name">Name</label><input id="name" type="text" placeholder="Enter your name" style="padding:12px;border:1px solid #ccc;border-radius:7px"><label for="email">Email</label><input id="email" type="email" placeholder="Enter your email" style="padding:12px;border:1px solid #ccc;border-radius:7px">
<div style="display:flex;gap:10px;margin-top:10px"><button type="submit" style="padding:12px 20px;border:0;border-radius:7px;background:#2563eb;color:white;cursor:pointer">Submit</button><button type="reset" style="padding:12px 20px;border:0;border-radius:7px;background:#777;color:white;cursor:pointer">Reset</button></div>
</form></div>
<div class="image" style="width:250px"><img src="image.jpg" alt="UI Illustration" style="width:100%;height:180px;object-fit:cover;border-radius:10px;border:2px solid #ddd"></div>
</section></main>
<footer style="background:#1e3a5f;color:white;text-align:center;padding:15px"><p style="margin:0">&copy; 2026 My Mini UI. All Rights Reserved.</p></footer>
</body></html>
