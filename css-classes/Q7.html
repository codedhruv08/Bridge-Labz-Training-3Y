<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Q7 - UI Components</title>
<style>
input:focus,select:focus{outline:none;border-color:#2563eb!important;box-shadow:0 0 5px #93c5fd}button:hover{transform:translateY(-2px);box-shadow:0 5px 10px #aaa}button{transition:.3s}
</style></head>
<body style="margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dbeafe,#fff);display:flex;justify-content:center;align-items:center">
<main style="width:500px;max-width:85%;background:white;padding:35px;border-radius:15px;box-shadow:0 8px 25px #bbb">
<h1 style="text-align:center">Simple User Interface</h1>
<div style="display:flex;gap:10px;margin:25px 0"><input type="search" placeholder="Search something..." style="flex:1;padding:12px;border:1px solid #ccc;border-radius:7px"><button style="padding:12px 20px;border:0;border-radius:7px;background:#2563eb;color:white;cursor:pointer">Search</button></div>
<div style="display:flex;gap:15px;margin-bottom:25px"><button style="padding:12px 20px;border:0;border-radius:7px;background:#2563eb;color:white;cursor:pointer">Login</button><button style="padding:12px 20px;border:0;border-radius:7px;background:#16a34a;color:white;cursor:pointer">Register</button></div>
<label for="category" style="display:block;margin-bottom:8px">Choose Category:</label>
<select id="category" style="width:100%;padding:12px;border:1px solid #ccc;border-radius:7px"><option>Select Category</option><option>Technology</option><option>Education</option><option>Sports</option><option>Entertainment</option></select>
</main></body></html>
