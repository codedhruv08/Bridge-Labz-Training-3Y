<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Q9 - Combined Effects</title>
<style>
.effect-button{transition:all .3s ease}.effect-button:hover{transform:scale(1.1);box-shadow:0 8px 15px #aaa}.effect-button:active{transform:scale(.95)}
.effect-card{transition:all .3s ease}.effect-card:hover{transform:translateY(-10px) scale(1.03);box-shadow:0 10px 20px #aaa!important}
</style></head>
<body style="margin:0;min-height:100vh;font-family:Arial,sans-serif;background:#f3f4f6;display:flex;justify-content:center;align-items:center">
<main style="width:90%;text-align:center"><h1>Combined CSS Effects</h1>
<section style="display:flex;justify-content:center;align-items:center;gap:25px;flex-wrap:wrap;margin-top:40px">
<button class="effect-button" style="padding:15px 25px;border:0;border-radius:8px;background:#2563eb;color:white;cursor:pointer">Hover Me</button>
<button class="effect-button" style="padding:15px 25px;border:0;border-radius:8px;background:#16a34a;color:white;cursor:pointer">Grow Me</button>
<button class="effect-button" style="padding:15px 25px;border:0;border-radius:8px;background:#9333ea;color:white;cursor:pointer">Click Me</button>
<div class="effect-card" style="width:220px;padding:25px;background:white;border-radius:10px;box-shadow:0 4px 10px #bbb"><h2>Hover Card</h2><p>Move your mouse over this card.</p></div>
</section></main></body></html>
