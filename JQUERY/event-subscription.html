<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Subscription Panel</title>
  <style>
* { box-sizing: border-box; }
body { font-family: "Segoe UI", Arial, sans-serif; max-width: 860px; margin: 0 auto; padding: 24px; background: #f5f6fa; color: #222; line-height: 1.5; }
header, footer { text-align: center; padding: 12px; }
h1 { margin: 0 0 4px; }
section { background: #fff; border-radius: 10px; padding: 18px; margin: 16px 0; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
button { background: #3b5bdb; color: #fff; border: 0; padding: 8px 14px; border-radius: 6px; cursor: pointer; margin: 4px 4px 4px 0; font-size: 14px; }
button:hover { background: #2f49b0; }
input, select { padding: 8px; border: 1px solid #bbb; border-radius: 6px; margin: 4px 4px 4px 0; font-size: 14px; }
ul { list-style: none; padding: 0; margin: 0; }
    .topic { display: flex; align-items: center; gap: 8px; padding: 10px; border-bottom: 1px solid #eee; }
    .topic .title { flex: 1; font-weight: 600; }
    .status { font-size: 13px; padding: 2px 8px; border-radius: 10px; background: #ffe3e3; color: #c92a2a; }
    .status.on { background: #d3f9d8; color: #2b8a3e; }
    button.remove { background: #e03131; }
    button:disabled { background: #adb5bd; cursor: not-allowed; }
    .msg { padding: 8px 12px; margin: 6px 0; border-radius: 6px; background: #d3f9d8; color: #2b8a3e; }
  </style>
</head>
<body>
  <header><h1>Event Subscription Panel</h1></header>
  <main>
    <section>
      <div id="messages" aria-live="polite"></div>
      <ul id="topicList">
        <li class="topic"><span class="title">Tech Conferences</span><span class="status">Notifications OFF</span><button class="sub">Subscribe</button><button class="unsub" disabled>Unsubscribe</button><button class="remove">Remove</button></li>
        <li class="topic"><span class="title">Music Festivals</span><span class="status">Notifications OFF</span><button class="sub">Subscribe</button><button class="unsub" disabled>Unsubscribe</button><button class="remove">Remove</button></li>
        <li class="topic"><span class="title">Sports Events</span><span class="status">Notifications OFF</span><button class="sub">Subscribe</button><button class="unsub" disabled>Unsubscribe</button><button class="remove">Remove</button></li>
        <li class="topic"><span class="title">Workshops</span><span class="status">Notifications OFF</span><button class="sub">Subscribe</button><button class="unsub" disabled>Unsubscribe</button><button class="remove">Remove</button></li>
        <li class="topic"><span class="title">Food Fairs</span><span class="status">Notifications OFF</span><button class="sub">Subscribe</button><button class="unsub" disabled>Unsubscribe</button><button class="remove">Remove</button></li>
      </ul>
    </section>
    <section>
      <h2>Add a new topic</h2>
      <input type="text" id="newTopic" placeholder="Topic name">
      <button id="addTopic">Add Topic</button>
    </section>
  </main>
  <footer><small>jQuery Assignment 9</small></footer>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="event-subscription.js"></script>
</body>
</html>
